navapex_planner:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    scan_topic: /scan
    robot_radius: 0.125
    odom_topic: /odom
    goal_topic: /goal_pose
    cmd_vel_topic: /cmd_vel
    planning_frequency: 10.0
    command_frequency: 20.0
    input_timeout: 0.5
    map_timeout: 1.0
    command_timeout: 0.35
    auto_start: false
    goal_x: 3.5
    goal_y: 0.0
    goal_yaw: 0.0
